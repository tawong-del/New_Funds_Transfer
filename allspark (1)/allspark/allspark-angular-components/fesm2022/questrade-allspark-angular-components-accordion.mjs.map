<div
  class="q-accordion-header q-focus-indicator-inset"
  role="button"
  tabindex="0"
  [attr.aria-expanded]="active"
  [attr.aria-disabled]="disabled"
  (click)="_onHeaderClick()"
  (keyup.enter)="_onHeaderClick()"
  (keyup.space)="_onHeaderClick()">
  <ng-content select="q-badge[top]" />
  <div class="q-accordion-header-title">
    <div class="q-accordion-header-title-content">
      <ng-container *ngIf="title; else projectedTitle">
        <div class="q-accordion-header-title-text">{{ title }}</div>
      </ng-container>
      <ng-template #projectedTitle>
        <ng-content select="[q-accordion-title]" />
      </ng-template>
      <ng-content select="q-badge[left], q-badge[right]" />
      <ng-container *ngIf="showIcon">
        <q-expansion-trigger [tabIndex]="-1" [active]="active" [disabled]="disabled" />
      </ng-container>
    </div>
    <div *ngIf="subTitle" class="q-accordion-header-subtitle">{{ subTitle }}</div>
  </div>
  <ng-container
    *ngTemplateOutlet="
      headerAdditionalContentTemplate;
      context: { $implicit: headerAdditionalContentContext }
    " />
</div>

<div
  class="q-accordion-body"
  [ngClass]="{ 'active': active }"
  [@bodyExpansion]="active ? 'expanded' : 'collapsed'">
  <ng-content />
</div>
