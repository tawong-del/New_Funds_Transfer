<span [attr.hidden]="!_opened || null" [@expansionFade]="_opened ? 'expanded' : 'collapsed'">
  <ng-content />
</span>

<div class="q-spoiler-chip">
  <q-chip
    [type]="chipType"
    [textStyle]="chipTextStyle === 'primary' ? 'secondary' : 'primary'"
    [checkType]="'none'"
    [icon]="chipIcon"
    [iconPosition]="'right'"
    [toggleOnClick]="true"
    [disabled]="disabled"
    (changed)="_onChipChanged($event)">
    <span [@textTransition]="_opened ? 'showText' : 'hideText'">{{ chipText }}</span>
  </q-chip>
</div>
