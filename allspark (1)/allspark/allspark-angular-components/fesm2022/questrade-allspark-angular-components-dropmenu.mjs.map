<ng-container
  *ngTemplateOutlet="
    optionTemplate || defaultOptionTemplate;
    context: { $implicit: { value, label, subLabel, disabled, icon }, index }
  " />
<ng-template #defaultOptionTemplate>
  <div class="q-dropmenu-option-label-wrapper">
    <q-icon
      *ngIf="icon"
      [size]="'24'"
      [class.q-dropmenu-icon-default]="useOverlay"
      [name]="icon"
      [dataQt]="'q-dropmenu-option-icon'" />

    <div class="q-dropmenu-option-label">
      <span
        [qTextHighlight]="disabled ? '' : textToHighlight"
        [caseSensitive]="highlightCaseSensitive"
        [text]="label"></span>
      <div *ngIf="subLabel" class="q-dropmenu-option-sublabel">
        {{ subLabel }}
      </div>
    </div>
  </div>

  <q-icon
    *ngIf="selected && !_dropmenu.disableSelectionTracking"
    aria-hidden="true"
    class="q-dropmenu-icon-check-mark"
    [size]="'24'"
    [name]="'check'"
    [dataQt]="'q-dropmenu-check-icon'" />
</ng-template>
