<ng-container *ngIf="useOverlay; else menulist">
  <ng-container *ngIf="loading; else menuListTemplate">
    <div class="q-dropmenu-loading-container">
      <q-spinner *ngIf="loadingVariant === 'spinner'; else loadingSkeleton" [size]="'small'" />

      <ng-template #loadingSkeleton>
        <ng-container
          *ngIf="loadingSkeletonTemplate; else skeletonDefault"
          [ngTemplateOutlet]="loadingSkeletonTemplate" />

        <ng-template #skeletonDefault>
          <div class="skeleton-container">
            <div class="skeleton-item" *ngFor="let _ of [1, 2, 3, 4]">
              <q-skeleton class="skeleton-item-avatar" [height]="24" [width]="24" />
              <q-skeleton class="skeleton-item-label" [height]="14" />
            </div>
          </div>
        </ng-template>
      </ng-template>
    </div>
  </ng-container>

  <ng-template #menuListTemplate>
    <ng-container *ngIf="!options.length; else menulist">
      <div
        [class.q-dropmenu-empty-custom-container]="emptyStateTemplate"
        [class.q-dropmenu-empty-container]="!emptyStateTemplate">
        <div
          [class.q-dropmenu-empty-custom-message]="emptyStateTemplate"
          [class.q-dropmenu-empty-message]="!emptyStateTemplate">
          <ng-container *ngTemplateOutlet="emptyStateTemplate || defaultEmptyStateTemplate" />
        </div>
      </div>
      <ng-template #defaultEmptyStateTemplate>
        <q-icon [size]="'24'" name="search" />
        <span class="q-dropmenu-empty-message-label">
          {{ 'allspark.dropmenu.notFoundMessage' | transloco }}
        </span>
      </ng-template>
    </ng-container>
  </ng-template>

  <div *ngIf="hasFooter" class="q-dropmenu-footer">
    <ng-container *ngTemplateOutlet="footerTemplate || defaultFooterTemplate" />
    <ng-template #defaultFooterTemplate>
      <span>
        {{ footerMessage }}
      </span>
    </ng-template>
  </div>
</ng-container>

<ng-template #menulist>
  <div #dropmenu class="q-dropmenu-list" role="listbox" tabindex="-1">
    <div
      *ngFor="let option of options; trackBy: _trackOptionByFn; index as index; last as last"
      #optionItem
      role="option"
      class="q-dropmenu-option q-focus-indicator-inset"
      [class.q-dropmenu-disabled]="option.disabled"
      [attr.aria-selected]="isOptionSelected(option)"
      [tabindex]="option.disabled ? -1 : 0"
      [attr.data-qt]="'q-' + dataQt + '-item'"
      (click)="_onOptionClick(option)"
      (keyup.enter)="_onOptionClick(option)"
      (keyup.space)="_onOptionClick(option)"
      (keydown.tab)="_onTabKeydown()"
      (focus)="_onFocus(last)">
      <q-checkbox
        [tabIndex]="-1"
        class="q-dropmenu-multiple-select-checkbox"
        (checkboxChange)="_onOptionClick(option)"
        [checked]="isOptionSelected(option)"
        [disabled]="option.disabled">
        <ng-container
          *ngTemplateOutlet="
            optionTemplate || defaultOptionTemplate;
            context: { $implicit: option, index: index }
          " />
        <ng-template #defaultOptionTemplate>
          {{ option.label }}
        </ng-template>
      </q-checkbox>
    </div>
  </div>
</ng-template>
