<div
  #calendarHeaderRef
  class="q-calendar-header"
  *transloco="let t"
  tabindex="-1"
  [ngSwitch]="currentView">
  <div class="q-calendar-header-navigation" *ngSwitchCase="'month'">
    <q-interactive-icon
      [style.visibility]="showChevronLeft ? 'visible' : 'hidden'"
      [icon]="'chevronLeft'"
      [size]="'medium'"
      [disabled]="_isYearAndMonthSameOrBeforeMinDate()"
      [dataQt]="'q-calendar-header-chevron-left-icon'"
      (click)="_onPreviousClicked($event)"
      [tabindex]="_isYearAndMonthSameOrBeforeMinDate() ? -1 : 0"
      [attr.aria-label]="
        previousMonthButtonAriaLabel || t('allspark.datepicker.header.previousMonth')
      " />
    <div class="q-calendar-chip-container">
      <q-chip
        qDropmenuOrigin
        #monthTrigger="qDropmenuOrigin"
        class="q-calendar-header-chip"
        [type]="'text'"
        isDropdown
        [attr.id]="monthViewId"
        [active]="monthDropmenu.isOpened"
        (changed)="monthDropmenu.open()"
        aria-live="polite">
        {{ selectedMonthLabel | titlecase }}
      </q-chip>
      <q-dropmenu
        [dropmenuTrigger]="monthTrigger"
        #monthDropmenu
        [options]="monthNames"
        [value]="activeMonth"
        [density]="'compact'"
        (selectionChange)="onMonthSelectionChange($event)"
        [optionTemplate]="monthsTemplateRef">
      </q-dropmenu>

      <ng-template #monthsTemplateRef let-option let-index="index">
        <div>{{ option.label }}</div>
      </ng-template>

      <q-chip
        qDropmenuOrigin
        #yearTrigger="qDropmenuOrigin"
        class="q-calendar-header-chip"
        [type]="'text'"
        isDropdown
        aria-live="polite"
        [active]="yearDropmenu.isOpened"
        (changed)="yearDropmenu.open()">
        {{ activeDate?.getFullYear() }}
      </q-chip>
      <q-dropmenu
        #yearDropmenu
        [dropmenuTrigger]="yearTrigger"
        [options]="yearOptions"
        [value]="activeYear"
        [density]="'compact'"
        (selectionChange)="onYearSelectionChange($event)"
        [optionTemplate]="yearsTemplateRef">
      </q-dropmenu>

      <ng-template #yearsTemplateRef let-option let-index="index">
        <div>{{ option.label }}</div>
      </ng-template>
    </div>

    <q-interactive-icon
      [style.visibility]="showChevronRight ? 'visible' : 'hidden'"
      [icon]="'chevronRight'"
      [size]="'medium'"
      [dataQt]="'q-calendar-header-chevron-right-icon'"
      [disabled]="_isYearAndMonthSameOrAfterMaxDate()"
      (click)="_onNextClicked($event)"
      [tabindex]="_isYearAndMonthSameOrAfterMaxDate() ? -1 : 0"
      [attr.aria-label]="nextMonthButtonAriaLabel || t('allspark.datepicker.header.nextMonth')" />
  </div>

  <div
    *ngSwitchCase="'multi-year'"
    [attr.id]="multiYearViewId"
    class="q-calendar-header-title"
    aria-live="polite">
    {{ t('allspark.datepicker.header.selectYear') }}
  </div>
</div>
