<ng-container *transloco="let t">
  @if (isMobile) {
    <cdk-virtual-scroll-viewport
      itemSize="340"
      class="q-datepicker-mobile-container"
      qScrollShadow
      (scrolledIndexChange)="_onScrolledIndexChange()">
      <q-calendar
        *cdkVirtualFor="let cal of _calendarList"
        [calendarLocation]="'left'"
        [isMobile]="isMobile"
        [selected]="_getSelected()"
        [activeDate]="createDate(cal.year, cal.month, 1)"
        [currentView]="_currentViewFirstCalendar"
        [minDate]="minDate"
        [maxDate]="maxDate"
        (yearSelected)="_yearSelected($event)"
        (monthSelected)="_onMonthSelected($event)"
        (selectedChange)="_onSelectedChange($event)">
      </q-calendar>
    </cdk-virtual-scroll-viewport>
  } @else {
    <q-calendar
      #firstCalendar
      *ngIf="_showFirstCalendar() || !isMobile"
      [calendarLocation]="'left'"
      [displaySingleCalendar]="displaySingleCalendar"
      [selected]="_getSelected()"
      [currentView]="_currentViewFirstCalendar"
      [minDate]="minDate"
      [maxDate]="maxDate"
      [previousMonthButtonAriaLabel]="previousMonthButtonAriaLabel"
      [nextMonthButtonAriaLabel]="nextMonthButtonAriaLabel"
      (selectedChange)="_onSelectedChange($event)"
      (yearSelected)="_onYearSelected($event)"
      (viewChanged)="_viewChanged($event, 'firstCalendar', firstCalendar)"
      (monthChangedByArrow)="_onMonthChangedByArrow($event)" />

    @if (_showSecondCalendar()) {
      <q-calendar
        #secondCalendar
        [calendarLocation]="'right'"
        [displaySingleCalendar]="displaySingleCalendar"
        [selected]="_getSelected()"
        [currentView]="_currentViewSecondCalendar"
        [minDate]="minDate"
        [maxDate]="maxDate"
        [previousMonthButtonAriaLabel]="previousMonthButtonAriaLabel"
        [nextMonthButtonAriaLabel]="nextMonthButtonAriaLabel"
        (selectedChange)="_onSelectedChange($event)"
        (viewChanged)="_viewChanged($event, 'secondCalendar', secondCalendar)"
        (monthChangedByArrow)="_onMonthChangedByArrow($event)" />
    }
  }

  @if (_showFooter()) {
    <div class="q-datepicker-footer" [class.q-datepicker-footer-mobile]="isMobile">
      @if (displayClearButton) {
        <button
          #clearButton
          q-text-button
          [variant]="'secondary'"
          [size]="'small'"
          [dataQt]="'q-datepicker-clear-button'"
          (click)="_onClearClick()"
          [attr.aria-label]="clearButtonAriaLabel || t('allspark.datepicker.actions.clear')">
          {{ t('allspark.datepicker.actions.clear') }}
        </button>
      }
      @if (displayDoneButton) {
        <button
          #doneButton
          q-text-button
          [variant]="'secondary'"
          [size]="'small'"
          [dataQt]="'q-datepicker-done-button'"
          (click)="_onDoneClick()"
          [attr.aria-label]="doneButtonAriaLabel || t('allspark.datepicker.actions.done')">
          {{ t('allspark.datepicker.actions.done') }}
        </button>
      }
    </div>
  }
</ng-container>
