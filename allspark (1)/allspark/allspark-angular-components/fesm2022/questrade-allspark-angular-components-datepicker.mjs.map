<ng-container *transloco="let t">
  <table class="q-month-view-table" role="grid" [attr.aria-labelledby]="monthViewId">
    <thead class="q-calendar-table-header">
      <tr>
        <th
          *ngFor="let weekDay of _weekDays"
          scope="col"
          [class.q-calendar-disabled]="_disableWeekends && _isWeekend(weekDay)">
          {{ t('allspark.datepicker.weekdays.short.' + weekDay) }}
        </th>
      </tr>
    </thead>
    <tbody
      q-calendar-body
      role="rowgroup"
      [rows]="_weeks"
      [todayValue]="_todayDate"
      [isRange]="_isRange"
      [startValue]="_rangeStart"
      [endValue]="_rangeEnd"
      [minDate]="minDate"
      [maxDate]="maxDate"
      [disabledDates]="_disabledDates"
      [disableWeekends]="_disableWeekends"
      [calendarLocation]="calendarLocation"
      (selectedValueChange)="_dateSelected($event)"></tbody>
  </table>
</ng-container>
