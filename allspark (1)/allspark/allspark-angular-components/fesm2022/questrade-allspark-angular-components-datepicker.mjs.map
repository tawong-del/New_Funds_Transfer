<tr class="q-calendar-row" *ngFor="let row of rows; let rowIndex = index" role="row">
  <td
    *ngIf="rowIndex === 0 && _firstRowOffset"
    aria-hidden="true"
    [attr.colspan]="_firstRowOffset"
    [style.paddingTop]="_cellPadding"
    [style.paddingBottom]="_cellPadding"></td>
  <td
    *ngFor="let item of row; let colIndex = index"
    role="gridcell"
    class="q-calendar-cell-container"
    [attr.row]="rowIndex"
    [attr.aria-selected]="_isCalendarItemSelected(item)"
    [attr.col]="colIndex"
    (mouseenter)="onMouseEnter(item)"
    (mouseleave)="onMouseLeave()">
    <button
      type="button"
      class="q-calendar-cell"
      #calendarCellButton
      [attr.disabled]="!item.enabled ? true : null"
      [class.q-calendar-range-start]="_isRangeStart(item.date)"
      [class.q-calendar-range-end]="_isRangeEnd(item.date)"
      [class.q-calendar-in-range]="_isInRange(item.date?.getTime())"
      [class.q-calendar-preview-start]="_isPreviewStart(item.date)"
      [class.q-calendar-preview-end]="_isPreviewEnd(item.date)"
      [class.q-calendar-in-preview]="_isInPreview(item.date?.getTime())"
      [class.q-calendar-row-start]="item.date?.getDay() === 0 || item.value === 1"
      [class.q-calendar-row-end]="_showHighlightEnd(item)"
      [attr.tabindex]="getTabIndex(item)"
      (click)="_cellClicked(item, $event)">
      <div
        class="q-calendar-cell-content"
        [class.q-calendar-today]="item.date && todayValue === item.date.getTime()"
        [class.q-calendar-selected]="_isCalendarItemSelected(item)">
        {{ item.displayValue }}
      </div>
    </button>
  </td>
</tr>
