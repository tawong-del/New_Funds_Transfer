<q-calendar-header
  [activeDate]="activeDate"
  [currentView]="currentView"
  [maxDate]="maxDate"
  [minDate]="minDate"
  [isMobile]="isMobile"
  [displaySingleCalendar]="displaySingleCalendar"
  [calendarLocation]="calendarLocation"
  [previousMonthButtonAriaLabel]="previousMonthButtonAriaLabel"
  [nextMonthButtonAriaLabel]="nextMonthButtonAriaLabel"
  (previousClicked)="_changeMonth(-1)"
  (nextClicked)="_changeMonth(1)"
  (monthSelected)="_onMonthSelected($event)"
  (yearSelected)="_onYearSelected($event)"
  [monthViewId]="monthViewId"
  [multiYearViewId]="multiYearViewId" />

<div
  class="q-calendar-content q-calendar-content-{{ currentView }}"
  [style.box-shadow]="boxShadow$ | async"
  (scroll)="_calculateBoxShadows($event.target)">
  <q-month-view
    [selected]="selected"
    [maxDate]="maxDate"
    [minDate]="minDate"
    [(activeDate)]="activeDate"
    [monthViewId]="monthViewId"
    [calendarLocation]="calendarLocation"
    [attr.data-qt]="'q-calendar-month-view'"
    (daySelected)="_dateSelected($event)" />
</div>
