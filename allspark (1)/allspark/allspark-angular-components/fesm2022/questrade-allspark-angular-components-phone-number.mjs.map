<div class="q-phone-number-container">
  <q-country-picker
    [value]="countryIsoCode"
    [density]="dropmenuDensity"
    [disabled]="disabled"
    [readonly]="readonly"
    [visibleCountries]="visibleCountries"
    [groups]="groups"
    [hasError]="hasError"
    [errorStateMatcher]="errorStateMatcher"
    [dataQt]="`${dataQt}-country-picker`"
    (countrySelected)="onCountryChange($event)" />

  <input
    qInput
    #input
    type="tel"
    autocomplete="off"
    [placeholder]="phoneNumberPlaceholder()"
    [attr.value]="value"
    [dataQt]="`${dataQt}-input`"
    [invalidState]="hasError"
    [attr.readonly]="readonly || null"
    [attr.disabled]="disabled || null"
    (input)="onInputChange($event)"
    (blur)="onBlur()" />
</div>
