<div class="q-button-wrapper" tabindex="-1">
  <ng-container *ngIf="loadingText; else buttonSpinnerTemplate">
    <div class="q-button-loading-container">
      <div class="q-button-spinner">
        <ng-container [ngTemplateOutlet]="buttonSpinner" />
      </div>
      <span class="q-button-loading-content">
        {{ loadingText }}
      </span>
    </div>
  </ng-container>

  <div class="q-button-container">
    <q-icon
      *ngIf="icon"
      [name]="icon"
      [size]="iconSize"
      [dataQt]="'q-button-icon'"
      class="q-button-icon" />
    <span class="q-button-content">
      <ng-content />
    </span>
  </div>
</div>

<ng-template #buttonSpinnerTemplate>
  <div class="q-button-spinner-container" [class.q-button-hidden]="!loading">
    <ng-container *ngTemplateOutlet="buttonSpinner" />
  </div>
</ng-template>

<ng-template #buttonSpinner>
  <q-spinner *ngIf="loading" [size]="spinnerSize" variant="inherit" />
</ng-template>
