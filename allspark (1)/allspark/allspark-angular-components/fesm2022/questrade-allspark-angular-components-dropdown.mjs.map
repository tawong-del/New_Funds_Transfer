<div
  class="q-dropdown-trigger"
  qDropmenuOrigin
  #dropdownTrigger="qDropmenuOrigin"
  [class.q-dropdown-trigger-expanded]="isDropdownOpened">
  <ng-container *ngIf="searchable; else buttonTrigger">
    <q-input-group
      [prefix]="_selectedOption?.icon && _inputValue === _selectedOption?.label ? prefixIcon : null"
      [suffix]="arrowIcon">
      <input
        qInput
        #input
        class="q-dropdown-input"
        autocomplete="off"
        [(ngModel)]="_inputValue"
        [placeholder]="placeholder"
        [invalidState]="hasError"
        [disabled]="disabled"
        [readonly]="readonly"
        [dataQt]="`${dataQt}-input`"
        [attr.id]="controlId"
        (focus)="_onInputFocus($event)"
        (blur)="_onInputBlur($event)"
        (input)="_onInputChange($event)"
        (keydown)="_onInputTriggerKeyDown($event)"
        (click)="_onInputClick()" />
    </q-input-group>
  </ng-container>
</div>

<q-dropmenu
  #dropmenuRef
  [density]="dropmenuDensity"
  [options]="options"
  [dropmenuTrigger]="dropdownTrigger"
  [value]="value"
  [minWidth]="0"
  [fitOverlayWidth]="dropmenuWidth === 'full'"
  [textToHighlight]="(_searchStringObservable$ | async) || ''"
  [highlightCaseSensitive]="searchCaseSensitive"
  [loading]="loading"
  [loadingVariant]="loadingVariant"
  [loadingSkeletonTemplate]="loadingSkeletonTemplate"
  [footerMessage]="dropmenuFooterMessage"
  [footerTemplate]="dropmenuFooterTemplate"
  [dataQt]="`${dataQt}-dropmenu`"
  [optionTemplate]="dropmenuOptionTemplate"
  [emptyStateTemplate]="dropmenuEmptyStateTemplate"
  [groupBy]="groupBy"
  [groupLabel]="groupLabel"
  [groupLabelTemplate]="groupLabelTemplate"
  (valueChange)="_onValueChanged($event)"
  (selectionChange)="_onDropmenuSelection($event)"
  (closed)="_onDropmenuClose()" />

<ng-template #buttonTrigger>
  <button
    #button
    type="button"
    class="q-dropdown-button q-focus-indicator-inset"
    [class.q-dropdown-button-readonly]="readonly"
    [class.error]="hasError"
    [attr.id]="controlId"
    [disabled]="disabled"
    (click)="_onButtonTriggerClick()"
    (keydown)="_onButtonTriggerKeydown($event)">
    <ng-container *ngIf="_selectedOption?.icon" [ngTemplateOutlet]="prefixIcon" />

    <div *ngIf="_triggerValue; else placeholderBlock" class="q-dropdown-content">
      {{ _triggerValue }}
    </div>

    <ng-template #placeholderBlock>
      <span class="q-dropdown-placeholder" [class.q-dropdown-placeholder-readonly]="readonly">
        {{ placeholder }}
      </span>
    </ng-template>

    <ng-container [ngTemplateOutlet]="arrowIcon" />
  </button>
</ng-template>

<ng-template #arrowIcon>
  <q-icon
    [name]="'dropArrowDown'"
    [@triggerRotate]="isDropdownOpened ? 'expanded' : 'collapsed'"
    (click)="_onArrowIconClick()"
    class="q-icon-arrow"
    [size]="'24'"
    [dataQt]="`${dataQt}-arrow-icon`" />
</ng-template>

<ng-template #prefixIcon>
  <q-icon
    class="q-dropdown-icon"
    [size]="'24'"
    [name]="_selectedOption?.icon ?? ''"
    [dataQt]="`${dataQt}-option-icon`" />
</ng-template>
