<div
  *transloco="let t"
  class="{{ rootClass }}-container"
  [class.q-table-footer-medium]="paginationType !== 'button'"
  [class.q-table-footer-large]="paginationType === 'button'"
  [ngSwitch]="paginationType">
  <div *ngSwitchCase="'paginator'" class="{{ rootClass }}-paginator-container">
    <q-paginator
      [totalItems]="totalItems"
      [currentPage]="currentPage"
      [pageSize]="pageSize"
      (changed)="_onPageChanged($event)" />
  </div>

  <div *ngSwitchCase="'infinite'" class="{{ rootClass }}-spinner">
    <q-spinner *ngIf="totalItems !== pageSize && infiniteLoading" [size]="'x-small'" />
    <span *ngIf="totalItems === pageSize" class="q-note">
      {{ t(_getTranslationPluralization(), { totalItems }) }}
    </span>
  </div>

  <div *ngSwitchDefault>
    <q-chip
      *ngIf="totalItems > pageSize"
      [type]="'text'"
      [icon]="'add'"
      (changed)="_increasePageSize()">
      {{ t('allspark.table.footer.showMore', { nextBatchSize }) }}
    </q-chip>
    <span *ngIf="totalItems <= pageSize" class="q-note">
      {{ t(_getTranslationPluralization(), { totalItems }) }}
    </span>
  </div>
</div>
