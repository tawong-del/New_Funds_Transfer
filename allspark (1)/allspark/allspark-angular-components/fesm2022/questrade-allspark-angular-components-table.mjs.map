<div
  class="q-table"
  [class.q-table-flex-scroll]="flexScroll"
  [class.q-table-rounded-corners]="roundedCorners">
  <ng-container *ngIf="scrollY || scrollX; else defaultTemplate">
    <div #tableHeaderElement class="q-table-header" [style.width]="scrollX">
      <table
        q-table-content
        tableLayout="fixed"
        [listOfColWidth]="listOfColWidth"
        [theadTemplate]="theadTemplate"
        [scrollX]="scrollX"
        [scrollY]="scrollY"></table>
    </div>

    <div
      #tableBodyElement
      qScrollShadow
      class="q-table-body"
      [style.height]="scrollY"
      [style.width]="scrollX">
      <table
        q-table-content
        tableLayout="fixed"
        [scrollX]="scrollX"
        [scrollY]="scrollY"
        [style.max-height]="scrollY"
        [listOfColWidth]="listOfColWidth"
        [contentTemplate]="contentTemplate"
        [loading]="loading"
        [errorState]="errorState"
        [errorStateTitle]="errorStateTitle"
        [errorStateDescription]="errorStateDescription"
        [empty]="isEmpty"
        [emptyStateTitle]="emptyStateTitle"
        [emptyStateDescription]="emptyStateDescription"
        [showEmptyStateIcon]="showEmptyStateIcon"
        [emptyStateButton]="emptyStateButton"></table>
    </div>
  </ng-container>

  <ng-template #defaultTemplate>
    <div class="q-table-default-table-content">
      <table
        q-table-content
        [theadTemplate]="theadTemplate"
        [contentTemplate]="contentTemplate"
        [tableLayout]="tableLayout"
        [listOfColWidth]="listOfColWidth"
        [loading]="loading"
        [errorState]="errorState"
        [errorStateTitle]="errorStateTitle"
        [errorStateDescription]="errorStateDescription"
        [empty]="isEmpty"
        [emptyStateTitle]="emptyStateTitle"
        [emptyStateDescription]="emptyStateDescription"
        [showEmptyStateIcon]="showEmptyStateIcon"
        [emptyStateButton]="emptyStateButton"></table>
    </div>
  </ng-template>

  <q-table-footer
    *ngIf="hasFooter"
    [totalItems]="totalItems || tableData.length"
    [pageSize]="pageSize"
    [currentPage]="currentPage"
    [paginationType]="paginationType"
    [infiniteLoading]="infiniteLoading"
    [roundedCorners]="roundedCorners" />
</div>

<ng-template #contentTemplate>
  <ng-content />
</ng-template>

<ng-template #emptyStateButton>
  <ng-content select="[q-button][q-table-empty-button],[q-text-button][q-table-empty-button]" />
</ng-template>
