<div class="q-table-cell-content">
  <ng-container [ngSwitch]="variant">
    <ng-container *ngSwitchCase="'default'">
      <ng-content />
      <ng-content select="[secondaryValue]" />
      <ng-content select="[primaryDescription]" />
      <ng-content select="[secondaryDescription]" />
    </ng-container>

    <ng-container *ngSwitchCase="'radio'">
      <ng-content select="q-radio-button" />
    </ng-container>

    <ng-container *ngSwitchCase="'checkbox'">
      <ng-content select="q-checkbox" />
    </ng-container>
  </ng-container>
</div>
