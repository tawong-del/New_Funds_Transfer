<ng-container [ngSwitch]="variant">
  <ng-container *ngSwitchCase="'default'">
    <ng-container *ngTemplateOutlet="checkboxDefaultVariant" />
  </ng-container>

  <ng-container *ngSwitchCase="'container'">
    <ng-container *ngTemplateOutlet="checkboxContainerVariant" />
  </ng-container>

  <ng-container *ngSwitchCase="'expandable'">
    <ng-container *ngTemplateOutlet="checkboxExpandableVariant" />
  </ng-container>
</ng-container>

<ng-template #checkboxDefaultVariant>
  <div class="q-checkbox-base-container" (click)="_onTouchTargetClick($event)">
    <div class="q-checkbox-input-container">
      <input
        #inputRef
        role="checkbox"
        type="checkbox"
        class="q-checkbox-native-control"
        [id]="id"
        [checked]="checked"
        [indeterminate]="indeterminate"
        [disabled]="disabled"
        [required]="required"
        [tabIndex]="disabled ? -1 : tabIndex"
        [attr.name]="name"
        [attr.aria-label]="ariaLabel"
        [attr.aria-labelledby]="ariaLabelledby"
        [attr.aria-describedby]="ariaDescribedby"
        [attr.aria-checked]="indeterminate ? 'mixed' : null"
        [attr.data-qt]="'q-checkbox-native-control'"
        (blur)="_onBlur()"
        (change)="_onChangeEvent($event)" />

      <div class="q-checkbox-glow"></div>
      <div class="q-checkbox-frame"></div>

      <div class="q-checkbox-background">
        <svg class="q-checkbox-checkmark" focusable="false" viewBox="0 0 24 24" aria-hidden="true">
          <path class="q-checkbox-checkmark-path" fill="none" d="M4.1,12.7 9,17.6 20.3,6.3" />
        </svg>
        <div class="q-checkbox-mixedmark"></div>
      </div>
    </div>

    <label
      class="q-checkbox-label"
      [class.q-checkbox-label-with-extra-right]="canRenderExtraContentRight"
      [for]="id"
      (click)="_onLabelInteraction()">
      <div class="q-checkbox-label-content" [ngClass]="'q-checkbox-label-content-gap-' + labelGap">
        <ng-content />
      </div>

      <ng-content select="q-badge" />

      <ng-container *ngIf="variant !== 'expandable'">
        <ng-content select="q-link" />
      </ng-container>

      <div
        *ngIf="canRenderExtraContentRight"
        role="region"
        class="q-checkbox-extra-content q-checkbox-extra-content-position-right"
        [ngStyle]="{ width: extraContentRightWidth }"
        [attr.aria-labelledby]="id"
        [attr.data-qt]="'q-checkbox-extra-content-right'">
        <ng-container
          *ngTemplateOutlet="extraContent; context: { $implicit: extraContentContext }" />
      </div>
    </label>
    <q-expansion-trigger
      *ngIf="variant === 'expandable'"
      [disabled]="disabled || readonly"
      [active]="expanded"
      [attr.aria-controls]="id + '-container'"
      (activeChange)="_checkboxExpandable.toggle()" />
  </div>

  <div
    *ngIf="canRenderExtraContentBelow"
    class="q-checkbox-extra-content"
    role="region"
    [attr.id]="id + '-container'"
    [attr.aria-labelledby]="id"
    [attr.data-qt]="'q-checkbox-extra-content-below'"
    [ngClass]="'q-checkbox-extra-content-density-' + extraContentDensity">
    <ng-container *ngTemplateOutlet="extraContent; context: { $implicit: extraContentContext }" />
  </div>
</ng-template>

<ng-template #checkboxContainerVariant>
  <q-checkbox-container
    [expanded]="expanded"
    [extraContent]="extraContent"
    [extraContentContext]="extraContentContext"
    [extraContentDensity]="extraContentDensity"
    [extraContentPosition]="extraContentPosition"
    [variant]="variant"
    [disabled]="disabled"
    [checkboxInputId]="id"
    (checkboxContainerChange)="_onCheckboxContainerChange($event)">
    <ng-container *ngTemplateOutlet="checkboxDefaultVariant" />
  </q-checkbox-container>
</ng-template>

<ng-template #checkboxExpandableVariant>
  <q-checkbox-expandable
    [containerRef]="checkboxContainerVariant.elementRef"
    [disabled]="disabled"
    [expanded]="expanded"
    (expandedChange)="_onExpandedChange($event)">
    <ng-container *ngTemplateOutlet="checkboxContainerVariant" />
  </q-checkbox-expandable>
</ng-template>
