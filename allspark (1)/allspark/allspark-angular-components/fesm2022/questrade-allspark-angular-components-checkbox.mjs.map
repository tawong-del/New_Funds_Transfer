<div class="q-checkbox-container" (click)="_onContainerInteraction($event)">
  <div
    class="q-checkbox-container-header"
    [ngClass]="{ 'q-checkbox-container-header-expanded': expanded }">
    <ng-content />
  </div>
  <div
    *ngIf="extraContent && extraContentPosition === 'below'"
    class="q-checkbox-container-extra-content"
    role="region"
    [ngClass]="'q-checkbox-extra-content-density-' + extraContentDensity"
    [@bodyExpansion]="variant === 'expandable' ? (expanded ? 'expanded' : 'collapsed') : null"
    [attr.id]="checkboxInputId + '-container'"
    [attr.aria-labelledby]="checkboxInputId"
    [attr.data-qt]="'q-checkbox-extra-content-below'">
    <ng-container *ngTemplateOutlet="extraContent; context: { $implicit: extraContentContext }" />
  </div>
</div>
