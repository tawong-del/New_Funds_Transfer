<div class="q-badge-template">
  <ng-content />
</div>
<div class="q-badge-container">
  <q-icon
    *ngIf="iconName"
    [name]="iconName"
    [dataQt]="'q-badge-icon'"
    class="q-badge-icon"
    [size]="'12'" />
  @if (variant !== 'dot') {
    <span class="q-badge-text">{{ text }}</span>
  }
</div>
