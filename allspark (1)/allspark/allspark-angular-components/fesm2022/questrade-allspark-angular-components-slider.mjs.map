<ng-content />

<div class="q-slider-track">
  <div class="q-slider-track-inactive"></div>
  <div class="q-slider-track-active">
    <div #trackActive class="q-slider-track-active-fill"></div>
  </div>

  <ng-container *ngIf="!showTickMarks">
    <div
      class="q-slider-tick-mark-fixed q-slider-left"
      [class.q-slider-left-single]="!_isRange"></div>
    <div class="q-slider-tick-mark-fixed q-slider-right"></div>
  </ng-container>

  <div *ngIf="showTickMarks && _cachedWidth" class="q-slider-tick-marks">
    <div
      *ngFor="let tickMark of _tickMarks; let i = index"
      [class]="tickMark === 0 ? 'q-slider-tick-mark-active' : 'q-slider-tick-mark-inactive'"
      [style.transform]="_calcTickMarkTransform(i)"></div>
  </div>
</div>

<ng-container *ngIf="_isRange">
  <q-slider-visual-thumb
    #startThumb
    [thumbPosition]="1"
    [tooltip]="tooltip"
    [valueIndicatorText]="_startValueIndicatorText"
    [disabled]="disabled"
    (focusChange)="_thumbFocusChange($event, startThumb)"
    (keyboardFocusChange)="_thumbKeyboardFocusChange($event, startThumb)"
    (hoverChange)="_thumbHoverChange($event, startThumb)" />

  <div
    class="q-slider-thumb-hover"
    *ngIf="_startThumbHoverVisible"
    [style.transform]="startThumb?._hostElement?.style?.transform"></div>

  <div
    *ngIf="_startThumbFocusVisible"
    #startThumbFocusIndicator
    class="q-slider-thumb-focus"
    [style.transform]="startThumb?._hostElement?.style?.transform"></div>

  <div
    [class.q-slider-thumb-keyboard-focus]="_startThumbKeyboardFocusVisible"
    [style.transform]="startThumb?._hostElement?.style?.transform"></div>
</ng-container>

<q-slider-visual-thumb
  #endThumb
  [tooltip]="tooltip"
  [thumbPosition]="2"
  [valueIndicatorText]="_endValueIndicatorText"
  [disabled]="disabled"
  (focusChange)="_thumbFocusChange($event, endThumb)"
  (keyboardFocusChange)="_thumbKeyboardFocusChange($event, endThumb)"
  (hoverChange)="_thumbHoverChange($event, endThumb)" />

<div
  *ngIf="_endThumbHoverVisible"
  class="q-slider-thumb-hover"
  [style.transform]="endThumb?._hostElement?.style?.transform"></div>

<div
  *ngIf="_endThumbFocusVisible"
  #endThumbFocusIndicator
  class="q-slider-thumb-focus"
  [style.transform]="endThumb?._hostElement?.style?.transform"></div>

<div
  [class.q-slider-thumb-keyboard-focus]="_endThumbKeyboardFocusVisible"
  [style.transform]="endThumb?._hostElement?.style?.transform"></div>

<span class="q-slider-label-container" *ngIf="valueLabel">
  <span class="q-slider-left-label">{{ min }}</span>
  <span class="q-slider-right-label">{{ max }}</span>
</span>
