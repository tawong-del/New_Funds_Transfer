<ng-container [ngSwitch]="currentVariant">
  <ng-container *ngSwitchCase="'default'">
    <ng-container *ngTemplateOutlet="radioDefaultVariant" />
  </ng-container>

  <ng-container *ngSwitchCase="'container'">
    <ng-container *ngTemplateOutlet="radioContainerVariant" />
  </ng-container>

  <ng-container *ngSwitchCase="'expandable'">
    <ng-container *ngTemplateOutlet="radioExpandableVariant" />
  </ng-container>
</ng-container>

<ng-template #radioDefaultVariant>
  <div
    class="q-radio-button-container"
    [class.q-radio-button-container-disabled]="disabled"
    (click)="_onTouchTargetClick($event)">
    <div class="q-radio-button-input-container">
      <input
        #inputRef
        class="q-radio-button-native-control"
        type="radio"
        [id]="id"
        [checked]="checked"
        [disabled]="disabled"
        [readonly]="readonly"
        [tabIndex]="tabIndex"
        [attr.data-qt]="'q-radio-button-native-control-' + id"
        [attr.name]="name"
        [attr.value]="value"
        [required]="required"
        [attr.aria-label]="ariaLabel"
        [attr.aria-labelledby]="ariaLabelledby"
        [attr.aria-describedby]="ariaDescribedby"
        (click)="_onInputClick($event)"
        (change)="_onInputInteraction($event)" />

      <div class="q-radio-button-background">
        <div class="q-radio-button-background-outer-circle"></div>
        <div class="q-radio-button-background-inner-circle"></div>
      </div>
    </div>

    <label
      class="q-radio-button-label"
      [class.q-radio-button-label-with-extra-right]="canRenderExtraContentRight"
      [for]="id"
      (click)="_onLabelInteraction()">
      <div
        class="q-radio-button-label-content"
        [ngClass]="'q-radio-button-label-content-gap-' + currentLabelGap">
        <ng-content />
      </div>

      <ng-content select="q-badge" />

      <ng-container *ngIf="currentVariant !== 'expandable'">
        <ng-content select="q-link" />
      </ng-container>

      <div
        *ngIf="canRenderExtraContentRight"
        role="region"
        class="q-radio-extra-content q-radio-extra-content-position-right"
        [ngStyle]="{ width: extraContentRightWidth }"
        [attr.aria-labelledby]="id"
        [attr.data-qt]="'q-radio-extra-content-right'">
        <ng-container
          *ngTemplateOutlet="extraContent; context: { $implicit: extraContentContext }" />
      </div>
    </label>
    <q-expansion-trigger
      #expansionTrigger
      *ngIf="currentVariant === 'expandable'"
      [disabled]="disabled || readonly"
      [active]="expanded"
      [tabIndex]="!_radioGroup?.value || checked ? 0 : -1"
      [attr.aria-controls]="id + '-container'"
      (activeChange)="_radioExpandable.toggle()" />
  </div>

  <div
    *ngIf="canRenderExtraContentBelow"
    class="q-radio-extra-content"
    [ngClass]="'q-radio-extra-content-density-' + extraContentDensity"
    role="region"
    [attr.id]="id + '-container'"
    [attr.aria-labelledby]="id"
    [attr.data-qt]="'q-radio-extra-content-below'">
    <ng-container *ngTemplateOutlet="extraContent; context: { $implicit: extraContentContext }" />
  </div>
</ng-template>

<ng-template #radioContainerVariant>
  <q-radio-container
    [expanded]="expanded"
    [radioInputId]="id"
    [extraContent]="extraContent"
    [extraContentContext]="extraContentContext"
    [extraContentDensity]="extraContentDensity"
    [extraContentPosition]="extraContentPosition"
    [variant]="currentVariant"
    [disabled]="disabled"
    (radioContainerChange)="_onRadioContainerChange($event)">
    <ng-container *ngTemplateOutlet="radioDefaultVariant" />
  </q-radio-container>
</ng-template>

<ng-template #radioExpandableVariant>
  <q-radio-expandable
    [containerRef]="radioContainerVariant.elementRef"
    [disabled]="disabled"
    [expanded]="expanded"
    (expandedChange)="_onExpandedChange($event)">
    <ng-container *ngTemplateOutlet="radioContainerVariant" />
  </q-radio-expandable>
</ng-template>
