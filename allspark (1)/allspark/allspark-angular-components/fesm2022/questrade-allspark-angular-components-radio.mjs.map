<div class="q-radio-container-header" [class.q-radio-container-header-expanded]="expanded">
  <ng-content />
</div>

<div
  *ngIf="extraContent && extraContentPosition === 'below'"
  class="q-radio-container-extra-content"
  role="region"
  [attr.id]="radioInputId + '-container'"
  [attr.aria-labelledby]="radioInputId"
  [ngClass]="'q-radio-extra-content-density-' + extraContentDensity"
  [@bodyExpansion]="variant === 'expandable' ? (expanded ? 'expanded' : 'collapsed') : null"
  [attr.data-qt]="'q-radio-extra-content-below'">
  <ng-container *ngTemplateOutlet="extraContent; context: { $implicit: extraContentContext }" />
</div>
