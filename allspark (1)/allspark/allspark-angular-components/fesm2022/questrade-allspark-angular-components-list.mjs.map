<ng-content />

<div class="q-list-item-grid-container">
  <div class="q-list-item-icon-left">
    <ng-content select="q-interactive-icon[left], q-icon[left]" />
  </div>

  <div class="q-list-item-content" (cdkObserveContent)="_onContentChange()" [debounce]="500">
    <div
      [style.width]="leftColumnWidth"
      class="q-list-item-content-left q-body-s"
      [attr.data-qt]="'q-list-item-left-column'">
      <ng-content select="[leftColumn]" />
    </div>

    <div
      [style.width]="rightColumnWidth"
      class="q-list-item-content-right q-body-s"
      [attr.data-qt]="'q-list-item-right-column'">
      <ng-content select="[rightColumn]" />
    </div>
  </div>

  <div class="q-list-item-right-container">
    <div class="q-list-item-icon-right">
      <ng-content select="q-interactive-icon[right], q-icon[right]" />
    </div>

    <div class="q-list-item-action-right">
      <ng-content select="button[right]" />
      <ng-content select="q-chip[right]" />
      <ng-content select="q-switch[right]" />
    </div>
  </div>

  <!-- vvasylevskyy: It is required, do not remove -->
  <div></div>

  <div class="q-list-item-action-bottom">
    <ng-content select="button[bottom]" />
    <ng-content select="q-chip[bottom]" />
    <ng-content select="q-switch[bottom]" />
  </div>
</div>
