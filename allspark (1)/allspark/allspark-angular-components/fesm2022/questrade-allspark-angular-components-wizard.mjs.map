<ng-container *transloco="let t">
  <div class="q-wizard">
    <div class="q-wizard-stepper-section">
      <div *ngIf="!_isScreenSmallDown" class="q-wizard-stepper-name q-overline">
        {{ wizardName }}
      </div>

      <div class="q-wizard-stepper-content">
        <q-stepper
          *ngIf="wizardService.steps$ | async as steps"
          [steps]="steps"
          [activeIndex]="wizardService.stepIndexes"
          [showProgressOnActive]="stepperShowProgressOnActive"
          [showProgressOnCompleted]="stepperShowProgressOnCompleted"
          [beforeActiveStepChange]="_onBeforeActiveStepChange"
          (activeIndexChange)="_onStepperActiveIndexChange($event)" />
      </div>
    </div>

    <div class="q-wizard-step-section" tabindex="-1">
      <ng-content select="q-banner" />
      <div class="q-wizard-step-scrollable-content" [style.height]="_stepContainerHeight">
        <div class="q-wizard-step-container">
          <q-wizard-step
            #wizardStepEl
            *ngIf="wizardService.activeStep$ | async as activeStep"
            [parentStepTitle]="
              wizardService.parentStep?.pageTitle || wizardService.parentStep?.title || ''
            "
            [title]="activeStep.pageTitle || activeStep.title"
            [dataQt]="'q-step-' + (activeStep.title | qKebabCase)"
            [wizardName]="wizardName"
            [isScreenSmallDown]="_isScreenSmallDown"
            [showPageTitle]="showPageTitle">
            <ng-container
              *ngTemplateOutlet="
                activeStep.template || null;
                context: {
                  $implicit: activeStep,
                  stepId: activeStep.id,
                  templateContext: activeStep.templateContext,
                }
              " />
          </q-wizard-step>

          <ng-container *ngIf="wizardService.activeStep$ | async">
            <ng-container
              *ngTemplateOutlet="
                showDefaultStepFooter ? defaultFooterTemplate : customStepFooterTemplate
              " />

            <ng-template #defaultFooterTemplate>
              <div class="q-wizard-step-footer">
                <div class="q-wizard-step-footer-actions">
                  <button
                    *ngIf="!_isSecondaryButtonHidden() && !hideSecondaryButton"
                    q-text-button
                    [variant]="'secondary'"
                    [disabled]="disableSecondaryButton"
                    [loading]="isBackLoading$ | async"
                    [dataQt]="'q-button-wizard-back'"
                    (click)="_onSecondaryButtonClicked()">
                    {{ t(secondaryButtonTranslationKey) }}
                  </button>
                  <button
                    *ngIf="!hidePrimaryButton"
                    q-button
                    [disabled]="disablePrimaryButton"
                    [loading]="isNextLoading$ | async"
                    [dataQt]="'q-button-wizard-next'"
                    (click)="_onPrimaryButtonClicked()">
                    {{ t(primaryButtonTranslationKey) }}
                  </button>
                </div>
              </div>
            </ng-template>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</ng-container>
