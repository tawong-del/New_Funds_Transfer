@if (showPageTitle) {
  <div class="q-wizard-step-header">
    <div *ngIf="isScreenSmallDown" class="q-wizard-step-header-name q-overline">
      {{ parentStepTitle || wizardName }}
    </div>
    <div #stepTitleEl class="q-wizard-step-title q-display-m q-focus-indicator" tabindex="-1">
      {{ title }}
    </div>
  </div>
}

<ng-container *ngTemplateOutlet="template || ngContentTemplate" />
<ng-template #ngContentTemplate>
  <ng-content />
</ng-template>
