<svg
  xmlns="http://www.w3.org/2000/svg"
  class="q-spinner-svg"
  fill="none"
  [attr.width]="sizeValue"
  [attr.height]="sizeValue"
  [attr.viewBox]="viewBox">
  <path
    class="q-spinner-path"
    stroke-linecap="round"
    stroke-linejoin="round"
    [attr.d]="path"
    [attr.stroke-width]="strokeWidth"></path>
</svg>
