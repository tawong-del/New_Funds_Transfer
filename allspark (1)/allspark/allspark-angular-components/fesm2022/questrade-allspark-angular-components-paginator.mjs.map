<div class="q-paginator-container">
  <div class="q-paginator-info">
    <div class="q-paginator-items" [class.q-paginator-items-right]="itemsInfoPosition === 'right'">
      {{ _currentPageFirstItem$ | async }} - {{ _currentPageLastItem$ | async }} of {{ totalItems }}
    </div>

    <div *ngIf="showPagesInfo" class="q-paginator-pages">
      <q-chip
        #chip
        qDropmenuOrigin
        #chipTrigger="qDropmenuOrigin"
        [isDropdown]="true"
        [type]="'text'"
        [disabled]="_dropdownOptions.length < 2"
        (changed)="dropmenu.open()"
        (keydown.enter)="dropmenu.open()"
        (keyup.space)="dropmenu.open()">
        {{ dropmenu.value }}
      </q-chip>
      <q-dropmenu
        #dropmenu
        [dropmenuTrigger]="chipTrigger"
        [options]="_dropdownOptions"
        [value]="currentPage"
        (valueChange)="_changePage($event)"
        (closed)="chip.setActiveValue(false)" />
      of {{ _numberOfPages$ | async }}
      {{ (_numberOfPages$ | async) === 1 ? 'page' : 'pages' }}
    </div>
  </div>

  <div class="q-paginator-actions">
    <q-interactive-icon
      [icon]="'chevronLeft'"
      [size]="'medium'"
      [disabled]="_isFirstPage()"
      (click)="_goPreviousPage()" />

    <q-interactive-icon
      [icon]="'chevronRight'"
      [size]="'medium'"
      [disabled]="_isLastPage()"
      (click)="_goNextPage()" />
  </div>
</div>
