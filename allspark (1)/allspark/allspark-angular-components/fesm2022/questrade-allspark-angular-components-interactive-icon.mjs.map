<div class="q-interactive-icon-container">
  <button
    type="button"
    attr.aria-label="{{ tooltipValue }} tooltip"
    class="q-focus-indicator
           q-interactive-icon-button q-interactive-icon-context-{{
      context
    }} q-interactive-icon-size-{{ iconSize ? iconSize : size }}"
    [class.q-interactive-icon-disabled]="disabled"
    [attr.tabindex]="tabindex"
    [attr.disabled]="disabled || null"
    [qTooltip]="tooltipValue"
    [qTooltipPosition]="tooltipPosition"
    [qTooltipShowDelay]="tooltipShowDelay"
    [qTooltipHideDelay]="tooltipHideDelay"
    [qTooltipLongPressDelay]="tooltipLongPressDelay">
    <q-icon [name]="icon" [size]="iconNumericSize" [dataQt]="'q-interactive-icon-icon'" />
  </button>
</div>
