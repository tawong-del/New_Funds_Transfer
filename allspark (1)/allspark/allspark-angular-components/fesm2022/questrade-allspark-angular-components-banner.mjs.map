<ng-container *transloco="let t">
  <div class="q-banner-content-wrapper">
    @if (icon) {
      <q-icon class="q-banner-icon" [size]="'24'" [name]="icon" [dataQt]="'q-banner-icon'" />
    }

    <div class="q-banner-content">
      @if (_titleVisible) {
        <ng-container *ngIf="!titleTemplate; else titleTemplateRef">
          <span class="q-banner-title">{{ title }}</span>
        </ng-container>
        <ng-template #titleTemplateRef>
          <ng-container *ngTemplateOutlet="titleTemplate" />
        </ng-template>
      }

      <div class="q-banner-body">
        <ng-content />
      </div>
    </div>
  </div>

  <div class="q-banner-actions">
    <ng-content select="[q-banner-actions]">
      @if (showCloseIcon) {
        <q-icon
          class="q-banner-close-icon q-focus-indicator"
          tabindex="0"
          [size]="'24'"
          [name]="'clear'"
          [dataQt]="'q-banner-close-icon'"
          (keydown.enter)="_onCloseIconClick($event)"
          (keydown.space)="_onCloseIconClick($event)"
          (click)="_onCloseIconClick($event)" />
      }
    </ng-content>
  </div>
</ng-container>
