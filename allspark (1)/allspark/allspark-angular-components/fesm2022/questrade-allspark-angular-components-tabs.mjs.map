<q-icon
  *ngIf="_leftScroll"
  class="q-icon-left"
  [size]="'16'"
  [class.is-mobile]="_isMobile"
  [name]="'chevronLeft'"
  [dataQt]="'q-left-icon'"
  (click)="_handleStartScrollClick()" />

<q-icon
  *ngIf="_rightScroll"
  class="q-icon-right"
  [size]="'16'"
  [class.is-mobile]="_isMobile"
  [name]="'chevronRight'"
  [dataQt]="'q-right-icon'"
  (click)="_handleEndScrollClick()" />

<div
  #tabList
  class="q-tabs-items"
  role="tablist"
  [attr.aria-labelledby]="ariaLabelledBy"
  [class.q-tabs-extra-padding]="hasExtraPadding"
  [class.q-tabs-scroll-left]="_leftScroll"
  [class.q-tabs-scroll-right]="_rightScroll"
  (keydown)="_handleKeydown($event)">
  <ng-content select="q-tab" />
  <div
    class="q-tab-underline"
    [class.q-tab-underline-no-transition]="_disableTransition"
    [style.transform]="translateX"
    [style.width]="_activeItemWidth"></div>
</div>

<q-divider *ngIf="hasBottomLine" />
