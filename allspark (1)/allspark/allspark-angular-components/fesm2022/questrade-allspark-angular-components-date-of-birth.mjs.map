<ng-container *transloco="let t">
  <q-form-control class="q-dob-form-control" [formGroup]="_dateOfBirthFormGroup">
    <div qLabel>{{ t('allspark.dateOfBirth.label') }}</div>

    <input
      type="text"
      qInput
      maxlength="2"
      class="q-dob-day"
      [readonly]="readonly"
      [formControl]="_dateOfBirthFormGroup.controls.day"
      [placeholder]="t('allspark.dateOfBirth.day')"
      [dataQt]="`${dataQt}-day`"
      (input)="onNumberInput($event, _dateOfBirthFormGroup.controls.day)" />

    <q-dropdown
      class="q-dob-month"
      [formControl]="_dateOfBirthFormGroup.controls.month"
      [readonly]="readonly"
      [options]="_months"
      [placeholder]="t('allspark.dateOfBirth.month')"
      [dataQt]="`${dataQt}-month`"
      (inputFocus)="_onMonthFocus()" />

    <input
      type="text"
      qInput
      maxlength="4"
      class="q-dob-year"
      [readonly]="readonly"
      [formControl]="_dateOfBirthFormGroup.controls.year"
      [placeholder]="t('allspark.dateOfBirth.year')"
      [dataQt]="`${dataQt}-year`"
      (input)="onNumberInput($event, _dateOfBirthFormGroup.controls.year)" />

    <div qHint>{{ t('allspark.dateOfBirth.hint') }}</div>
    <div qError>{{ t(_translocoCurrentErrorPath, { minAge, maxAge }) }}</div>
  </q-form-control>
</ng-container>
