<q-overlay
  #overlay
  [backdropClass]="'q-overlay-backdrop'"
  [panelClass]="['q-overlay-panel', 'q-pm-overlay-panel']"
  [overlayOrigin]="openedBy"
  [positions]="positions">
  <div class="q-promotional-message-arrow"></div>
  <ng-content>
    <div tabindex="-1" class="q-promotional-message-panel" [attr.data-qt]="dataQt">
      <div class="q-promotional-message-container">
        <div class="q-promotional-message-content" [attr.data-qt]="'q-promotional-message-content'">
          <div *ngIf="icon" class="q-promotional-message-icon-wrapper">
            <q-icon [size]="'24'" [name]="icon" [dataQt]="'q-promotional-message-container-icon'" />
          </div>

          <div
            class="q-promotional-message-message"
            [attr.data-qt]="'q-promotional-message-message'">
            <div
              *ngIf="title"
              class="q-promotional-message-header"
              [attr.data-qt]="'q-promotional-message-header'">
              {{ title }}
            </div>
            {{ message }}
          </div>
        </div>

        <div class="q-promotional-message-actions" [attr.data-qt]="'q-promotional-message-actions'">
          <button
            *ngIf="hasSecondaryButton"
            q-button
            variant="secondary"
            size="small"
            [dataQt]="'q-promotional-message-button-secondary'"
            (click)="close()">
            {{ secondaryButtonText }}
          </button>

          <button
            q-button
            variant="primary"
            size="small"
            [dataQt]="'q-promotional-message-button-primary'"
            (click)="close()">
            {{ primaryButtonText }}
          </button>
        </div>
      </div>
    </div>
  </ng-content>
</q-overlay>
