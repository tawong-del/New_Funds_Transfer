<div class="q-static-step-container" [ngClass]="{ 'q-static-step-bottom-margin': !last }">
  <div class="q-static-step-header">
    <q-progress-bar
      class="q-static-step-progress-bar"
      [variant]="'circular'"
      [progress]="_getProgressValue()"
      [selectedState]="step.status === 'pending'" />
    <span class="q-static-step-title q-display-xs">{{ step.title }}</span>
  </div>

  <div *ngIf="step.staticStepContent" #stepContent class="q-static-step-content">
    <ng-container
      *ngTemplateOutlet="
        step.staticStepContent;
        context: {
          $implicit: step,
          index: index,
          staticStepContext: step?.staticStepContext,
        }
      " />
  </div>
</div>
