<ng-container *ngIf="variant === 'static' && staticSteps.length; else standard">
  <q-static-step
    *ngFor="let step of staticSteps; let last = last; let index = index"
    [step]="step"
    [last]="last"
    [index]="index"
    [previousStepCompleted]="_isPreviousStaticStepCompleted(index)" />
</ng-container>

<ng-template #standard>
  <ng-container *ngIf="_horizontalView; else verticalView">
    <div class="q-stepper-horizontal-view" role="tree" aria-label="stepper">
      <span class="active-step-title q-display-xs">{{ activeStep?.title }}</span>

      <q-progress-bar
        *ngIf="steps.length"
        class="q-stepper-progress-bar"
        [size]="'thin'"
        [variant]="'steps'"
        [progress]="_overallProgress"
        [segments]="steps.length"
        [segmentInReviewIndex]="activeIndex.stepIndex" />

      <q-interactive-icon
        #trigger="cdkOverlayOrigin"
        class="menu-icon"
        cdkOverlayOrigin
        [class.steps-view-open]="_stepsViewOpen"
        [icon]="'unfoldMore'"
        [size]="'medium'"
        [dataQt]="'q-stepper-header-desktop-icon'"
        (click)="_toggleOverlay()"
        (keydown.enter)="_toggleOverlay()"
        (keydown.space)="_toggleOverlay()" />

      <q-overlay
        #overlay
        [overlayOrigin]="trigger"
        [offsetY]="0"
        (opened)="_stepsViewOpen = true"
        (closed)="_stepsViewOpen = false"
        [panelClass]="['q-overlay-panel', 'q-stepper-overlay-panel']">
        <ng-template #overlayContentTemplate>
          <div
            cdkTrapFocus
            cdkTrapFocusAutoCapture
            class="stepper-horizontal-container"
            [class.stepper-horizontal-container-mobile]="_isMobileView">
            <q-icon
              *ngIf="_isMobileView"
              class="close-icon"
              [name]="'clear'"
              [size]="'24'"
              (click)="_overlay.close()" />

            <div class="stepper-steps">
              <div class="steps-inner" (keydown)="_handleKeydown($event)">
                <ng-container *ngTemplateOutlet="stepsRef" />
              </div>
            </div>
          </div>
        </ng-template>
      </q-overlay>
    </div>
  </ng-container>

  <ng-template #verticalView>
    <div class="q-stepper-vertical-view" role="tree" (keydown)="_handleKeydown($event)">
      <ng-container *ngTemplateOutlet="stepsRef" />
    </div>
  </ng-template>
</ng-template>

<ng-template #stepsRef>
  <ng-container *ngIf="steps.length">
    <q-step
      #stepEl
      *ngFor="let step of steps; let i = index; let last = last"
      [step]="step"
      [activeIndex]="activeIndex"
      [index]="i"
      [last]="last"
      [horizontalView]="_horizontalView"
      [showProgressOnActive]="showProgressOnActive"
      [showProgressOnCompleted]="showProgressOnCompleted"
      [beforeActiveStepChange]="beforeActiveStepChange"
      [previousStepCompleted]="_isPreviousStepCompleted(i)"
      (activeIndexChange)="_onActiveIndexChange($event)"
      (stepFocus)="_onStepFocus(stepEl)"
      (subStepFocus)="_onStepFocus($event)" />
  </ng-container>
</ng-template>
