<div class="q-step-container" [class.q-step-expanded]="_stepExpanded">
  <div class="q-step-accordion" role="button">
    <div class="q-step-header-container">
      <q-progress-bar
        class="q-step-progress-bar"
        [variant]="'circular'"
        [circularProgressLabel]="circularProgressLabel"
        [progress]="_progress"
        [selectedState]="_inReview && index === activeIndex.stepIndex"
        [disabled]="_progress === 0 || isLocked" />

      <div
        #stepHeader
        role="treeitem"
        class="q-step-header q-focus-indicator-inset"
        [attr.tabindex]="isActive && !_stepExpanded ? 0 : -1"
        [attr.aria-owns]="ariaGroupId"
        [attr.aria-current]="isActive && !step.subSteps?.length ? 'step' : null"
        [attr.aria-expanded]="_stepExpanded"
        [attr.aria-selected]="isActive && !_stepExpanded"
        [attr.aria-disabled]="_progress === 0 || isLocked"
        [class.q-step-header-pointer]="_progress > 0 && !isLocked"
        (focus)="_onStepFocus()"
        (click)="_onStepClick()"
        (keyup.enter)="_onStepClick()"
        (keyup.space)="_onStepClick()">
        <div class="q-stepper-title-container">
          <span *ngIf="showProgress" class="step-progress q-note">
            {{ _progress === 2 ? 0 : _progress }}%
          </span>
          <span class="q-step-title q-display-xs" [class.q-step-upcoming-state]="_progress === 0">
            {{ step.title }}
          </span>
        </div>

        <q-icon
          *ngIf="showAccordion"
          name="chevronDown"
          class="chevron-down q-step-accordion-icon"
          [size]="'24'"
          [dataQt]="'q-step-chevron-down-icon'"
          [class.q-step-accordion-expanded-icon]="_stepExpanded" />

        <q-interactive-icon
          *ngIf="isLocked"
          [tabindex]="-1"
          [tooltipPosition]="'right'"
          [tooltipValue]="'Locked'"
          class="q-icon--md q-step-accordion-icon"
          [dataQt]="'q-step-lock-outline-icon'"
          [icon]="'lockOutline'" />
      </div>
    </div>
  </div>

  <div
    *ngIf="step?.subSteps?.length"
    class="q-sub-step-container"
    role="group"
    [attr.id]="ariaGroupId"
    [attr.aria-label]="step.title"
    [style.display]="_stepExpanded ? '' : 'none'">
    <q-sub-step
      #subStepEl
      role="none"
      *ngFor="let subStep of step?.subSteps; let subStepIndex = index"
      [subStep]="subStep"
      [index]="subStepIndex"
      [activeIndex]="activeIndex"
      [parentIndex]="index"
      [beforeActiveStepChange]="beforeActiveStepChange"
      [parentExpanded]="_stepExpanded"
      (completedChange)="_onSubStepCompleted()"
      (activeIndexChange)="_onActiveIndexChange($event)"
      (subStepFocus)="_onSubStepFocus(subStepEl)">
    </q-sub-step>
  </div>
</div>
