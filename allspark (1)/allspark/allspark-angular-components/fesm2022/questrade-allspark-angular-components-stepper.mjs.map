<div
  #subStepContent
  role="treeitem"
  class="q-sub-step-content q-focus-indicator-inset"
  [class.q-sub-step-first]="index === 0"
  [attr.tabindex]="isActive ? 0 : -1"
  [attr.aria-selected]="parentExpanded && isActive"
  [attr.aria-current]="isActive ? 'step' : null"
  (focus)="_onSubStepFocus()"
  (click)="_onSubStepClick()"
  (keyup.enter)="_onSubStepClick()"
  (keyup.space)="_onSubStepClick()">
  <span class="q-sub-step-title q-body-s" [class.q-sub-step-active]="isActive">
    {{ subStep.title }}
  </span>
  <div class="q-sub-step-tail"></div>
</div>
