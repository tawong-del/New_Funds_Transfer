<div
  #scrollAreaViewport
  qScrollShadow
  [qScrollShadowEnabled]="enableScrollShadow()"
  [id]="_viewportId"
  class="q-scroll-area-viewport"
  (wheel)="handleWheel($event)"
  [style.padding-right.px]="_viewportPaddingRight()"
  [style.padding-bottom.px]="_viewportPaddingBottom()">
  <ng-content />
</div>

<div
  #scrollbarX
  role="scrollbar"
  aria-orientation="horizontal"
  [attr.aria-controls]="_viewportId"
  [attr.aria-valuenow]="_ariaValueNowX"
  aria-valuemin="0"
  aria-valuemax="100"
  class="q-scroll-area-scrollbar q-scroll-area-scrollbar-x"
  [class.q-scroll-area-is-visible]="_showScrollbarX()"
  [style.right.px]="_showCorner() ? _cornerWidth : 0"
  (pointerdown)="handlePointerDown($event, 'x')">
  <div
    #thumbX
    class="q-scroll-area-thumb"
    [style.width.px]="_thumbSizeX"
    [style.transform]="'translateX(' + _thumbPositionX + 'px)'"></div>
</div>

<div
  #scrollbarY
  role="scrollbar"
  aria-orientation="vertical"
  [attr.aria-controls]="_viewportId"
  [attr.aria-valuenow]="_ariaValueNowY"
  aria-valuemin="0"
  aria-valuemax="100"
  class="q-scroll-area-scrollbar q-scroll-area-scrollbar-y"
  [class.q-scroll-area-is-visible]="_showScrollbarY()"
  [style.bottom.px]="_showCorner() ? _cornerHeight : 0"
  (pointerdown)="handlePointerDown($event, 'y')">
  <div
    #thumbY
    class="q-scroll-area-thumb"
    [style.height.px]="_thumbSizeY"
    [style.transform]="'translateY(' + _thumbPositionY + 'px)'"></div>
</div>

<div
  #corner
  class="q-scroll-area-corner"
  [class.q-scroll-area-is-visible]="_showCorner()"
  [style.width.px]="_cornerWidth"
  [style.height.px]="_cornerHeight"></div>
