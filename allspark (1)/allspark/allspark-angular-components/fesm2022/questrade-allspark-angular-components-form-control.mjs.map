<div class="q-form-control-head">
  <label
    class="q-form-control-label"
    [attr.for]="_formFieldControls.length && _formFieldControls.get(0)?.controlId">
    <ng-content select="[qLabel]" />
  </label>
</div>

<div class="q-form-control-body">
  <ng-content />
</div>

<div
  class="q-form-control-foot"
  [ngClass]="{
    'q-form-control-rb-error': isRadioButtonComponent,
    'q-form-control-rg-error': isRadioGroup,
    'q-form-control-checkbox-error': isCheckbox,
    'q-form-control-preserve-space': preserveFooterSpace,
  }"
  [ngSwitch]="_getDisplayedMessages()">
  <ng-container *ngSwitchCase="'error'">
    <label class="q-form-control-error">
      <ng-content select="[qError]" />
    </label>
  </ng-container>
  <ng-container *ngSwitchCase="'hint'">
    <label class="q-form-control-hint">
      <ng-content select="[qHint]" />
    </label>
  </ng-container>
</div>
