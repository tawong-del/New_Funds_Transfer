<div cdkTrapFocus class="{{ _rootClass }} q-modal-{{ size }}">
  <div class="{{ _rootClass }}-wrapper" (scroll)="onContainerScroll($event)">
    <div
      role="presentation"
      modal-overlay
      class="{{ _rootClass }}-overlay"
      [style.min-height.px]="_containerScrollHeight"
      (click)="onOverlayClicked($event)"></div>

    <div modal-container class="{{ _rootClass }}-container">
      @if (showHeader) {
        <div
          class="{{ _rootClass }}-header"
          [attr.data-qt]="'q-modal-header'"
          [class.include-back-icon]="isAlternativeContent">
          @if (isAlternativeContent) {
            <q-interactive-icon
              class="q-icon-back"
              [size]="'medium'"
              [icon]="'arrowBack'"
              [dataQt]="'q-modal-back-arrow'"
              (click)="previousContent()" />
          }
          <ng-container *ngTemplateOutlet="_modalHeaderTemplate || defaultHeaderTemplate" />
          <ng-template #defaultHeaderTemplate>
            <span
              [attr.data-qt]="'q-modal-title'"
              class="{{ _rootClass }}-header-title q-display-s">
              {{ title }}
            </span>
          </ng-template>
        </div>
      }

      <div
        #content
        class="{{ _rootClass }}-content"
        qScrollShadow
        [attr.data-qt]="'q-modal-content'"
        [tabIndex]="tabIndex"
        [class.q-modal-custom-padding-top]="!showHeader"
        [class.q-modal-custom-padding-bottom]="!showFooter">
        <ng-container *ngTemplateOutlet="_currentContentTemplate || defaultContentTemplate" />
        <ng-template #defaultContentTemplate>
          <ng-content modal-content />
        </ng-template>
      </div>

      @if (showFooter) {
        <div
          class="{{ _rootClass }}-footer"
          [attr.data-qt]="'q-modal-footer'"
          [class.stack-actions-mobile]="stackedActionsOnMobile">
          <ng-container *ngTemplateOutlet="_modalFooterTemplate || defaultFooterTemplate" />
          <ng-template #defaultFooterTemplate>
            <ng-container *transloco="let t">
              <div class="{{ _rootClass }}-footer-container">
                @if (showLink) {
                  <div class="{{ _rootClass }}-additional-actions">
                    <a
                      qLink
                      class="{{ _rootClass }}-additional-actions-link"
                      [attr.href]="linkUrl"
                      [dataQt]="'q-modal-link'"
                      [variant]="'primary'"
                      [size]="'14'"
                      [attr.disabled]="disableLink || null"
                      (click)="onLinkClicked($event)">
                      {{ linkText || t('allspark.modal.actions.link') }}
                    </a>
                  </div>
                }
                <div class="{{ _rootClass }}-actions">
                  @if (showSecondaryButton) {
                    <button
                      q-button
                      [variant]="secondaryButtonType"
                      [dataQt]="'q-modal-secondary-button'"
                      class="{{ _rootClass }}-actions-button"
                      [icon]="secondaryButtonIcon"
                      [iconPosition]="secondaryButtonIconPosition"
                      [disabled]="disableSecondaryButton"
                      (click)="onSecondaryButtonClick($event)">
                      {{ secondaryButtonText || t('allspark.modal.actions.cancel') }}
                    </button>
                  }
                  <button
                    q-button
                    [variant]="primaryButtonType"
                    [dataQt]="'q-modal-primary-button'"
                    class="{{ _rootClass }}-actions-button"
                    [icon]="primaryButtonIcon"
                    [iconPosition]="primaryButtonIconPosition"
                    [disabled]="disablePrimaryButton"
                    (click)="onPrimaryButtonClick($event)">
                    {{ primaryButtonText || t('allspark.modal.actions.ok') }}
                  </button>
                </div>
              </div>
            </ng-container>
          </ng-template>
        </div>
      }
    </div>
  </div>
</div>
