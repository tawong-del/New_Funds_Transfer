@if (position === 'bottom') {
  <ng-container [ngTemplateOutlet]="handle" />
}

@if (showHeader) {
  <div #header class="q-drawer-header" data-qt="q-drawer-header">
    @if (title) {
      <div class="q-drawer-header-title" [class.q-drawer-header-title-centered]="titleCentered">
        {{ title }}
      </div>
    }
    @if (showHeaderIcon) {
      <q-interactive-icon
        autofocus
        #closeIcon
        class="q-drawer-header-close-icon"
        data-qt="q-drawer-header-close-icon"
        [icon]="'clear'"
        [size]="'medium'"
        (click)="_onCloseIconClick($event)" />
    }
  </div>
}

<div class="q-drawer-content-container" data-qt="q-drawer-content-container">
  <div #content class="q-drawer-content">
    <ng-content />
  </div>
</div>

@if (position === 'top') {
  <ng-container [ngTemplateOutlet]="handle" />
}

<ng-template #handle>
  @if (_isMobile && !disableResize) {
    <div
      class="q-drawer-handle"
      [class.q-drawer-handle-inverse]="position === 'top'"
      data-qt="q-drawer-handle"
      (touchstart)="_onTouchStart($event)"
      (touchcancel)="_onTouchCancel($event)"
      (touchmove)="_onTouchMove($event)"
      (touchend)="_onTouchEnd($event)"
      (mousedown)="_onHandleMouseDown($event)">
      <div class="q-drawer-handle-content"></div>
    </div>
  }
</ng-template>
