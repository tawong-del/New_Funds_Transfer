<q-drawer-container
  #drawerContainer
  [title]="title"
  [titleCentered]="titleCentered"
  [showHeader]="showHeader"
  [showHeaderIcon]="showHeaderIcon"
  [disableResize]="disableResize"
  [disableDefaultClose]="disableDefaultClose"
  [position]="position"
  [width]="width"
  [height]="height"
  [snapList]="snapList"
  (closeIconClicked)="close()"
  (closeRequested)="_onDrawerContainerClose()"
  (fullscreenChange)="_onFullscreenChanged($event)">
  <ng-content />
</q-drawer-container>
