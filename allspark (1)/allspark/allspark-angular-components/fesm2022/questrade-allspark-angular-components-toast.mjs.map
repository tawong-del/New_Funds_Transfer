<div
  class="q-toast-top"
  [class.q-toast-has-side-actions]="(hasAction || hasActionAdditional) && actionsPosition === 'side'">
  <div qToastLabel>
    <q-icon *ngIf="iconName" [size]="'20'" [name]="iconName" [dataQt]="'q-toast-label-icon'" />
    <span class="q-toast-message">{{ data.message }}</span>
  </div>

  <div class="q-toast-side-actions">
    <ng-container *ngTemplateOutlet="actionsPosition === 'side' ? actions : null" />

    <div *ngIf="isDismissible" class="q-toast-dismiss-icon-container">
      <q-interactive-icon
        class="q-toast-dismiss-icon"
        [icon]="'clear'"
        [dataQt]="'q-toast-interactive-icon'"
        (click)="closeIconClick()" />
    </div>
  </div>
</div>

<ng-container *ngTemplateOutlet="actionsPosition === 'bottom' ? actions : null" />

<ng-template #actions>
  <div qToastActions>
    <button
      *ngIf="hasAction && isTextButtonType"
      q-text-button
      qToastAction
      [variant]="buttonVariant"
      [size]="'small'"
      [dataQt]="'q-toast-button-icon-secondary'"
      (click)="actionClick()">
      {{ data.action }}
    </button>

    <button
      *ngIf="hasActionAdditional && isTextButtonAdditionalType"
      q-text-button
      qToastAction
      [variant]="buttonAdditionalVariant"
      [size]="'small'"
      [dataQt]="'q-toast-button-icon-secondary'"
      (click)="additionalActionClick()">
      {{ data.actionAdditional }}
    </button>

    <button
      *ngIf="hasAction && !isTextButtonType"
      q-button
      qToastAction
      [variant]="buttonVariant"
      [size]="'small'"
      [dataQt]="'q-toast-button-icon-secondary'"
      (click)="actionClick()">
      {{ data.action }}
    </button>

    <button
      *ngIf="hasActionAdditional && !isTextButtonAdditionalType"
      q-button
      qToastAction
      [variant]="buttonAdditionalVariant"
      [size]="'small'"
      [dataQt]="'q-toast-button-icon-secondary'"
      (click)="additionalActionClick()">
      {{ data.actionAdditional }}
    </button>
  </div>
</ng-template>
