<div
  class="q-toggle-button-group q-toggle-button-group-{{ type }}"
  [class.q-toggle-button-group-disabled]="disabled"
  [class.q-toggle-button-group-width-full]="widthStrategy === '100%'">
  <div #indicator class="q-toggle-button-group-indicator"></div>
  <div class="q-toggle-button-group-options">
    <ng-content />
  </div>
</div>
