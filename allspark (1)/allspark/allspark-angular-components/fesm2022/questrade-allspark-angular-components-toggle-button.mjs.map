<button
  class="q-toggle-button q-toggle-button-{{ type }}"
  [class.q-toggle-button-width-full]="width === '100%'"
  [class.q-toggle-button-standalone]="standalone"
  [class.q-toggle-button-selected]="selected"
  [class.q-toggle-button-disabled]="disabled"
  [class.q-focus-indicator]="!disabled"
  [tabindex]="disabled ? -1 : 0"
  (click)="onButtonClick($event)">
  <ng-content />
</button>
