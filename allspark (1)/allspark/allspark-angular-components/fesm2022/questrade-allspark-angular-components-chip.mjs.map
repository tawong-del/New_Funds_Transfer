<div class="q-chip-container">
  <q-icon
    *ngIf="_isMultipleCheckTypeAndNotText && active"
    name="check"
    class="q-chip-icon"
    [size]="'20'"
    [dataQt]="'q-chip-multi-and-not-text-active-icon'"
    (click)="_onIconClick('check')" />

  <q-icon
    *ngIf="_showIconName && iconPosition === 'left'"
    [name]="_showIconName"
    class="q-chip-icon q-chip-{{ textStyle }}"
    [size]="'20'"
    [ngStyle]="_iconStyles"
    [dataQt]="'q-chip-left-icon'"
    (click)="_onIconClick(_showIconName)" />

  <label *ngIf="!isIconChip" class="q-chip-label q-chip-{{ textStyle }}">
    <ng-content />
  </label>

  <q-icon
    *ngIf="_showIconName && iconPosition === 'right'"
    [name]="_showIconName"
    class="q-chip-icon q-chip-{{ textStyle }}"
    [size]="'20'"
    [ngStyle]="_iconStyles"
    [dataQt]="'q-chip-right-icon'"
    (click)="_onIconClick(_showIconName)" />

  <q-icon
    *ngIf="toggleRightIcon"
    [name]="toggleRightIcon"
    class="q-chip-icon q-chip-{{ textStyle }}"
    [size]="'20'"
    [ngStyle]="_iconStyles"
    [dataQt]="'q-chip-toggle-right-icon'"
    (click)="_onIconClick(toggleRightIcon)" />

  <q-icon
    *ngIf="isDropdown"
    class="q-chip-icon"
    [size]="'20'"
    [name]="'dropArrowDown'"
    [@triggerRotate]="active ? 'expanded' : 'collapsed'"
    [dataQt]="'q-chip-dropdown-icon'"
    (click)="_onIconClick('dropArrowDown')" />
</div>
