<q-overlay
  #overlay
  [xPosition]="xPosition"
  [yPosition]="yPosition"
  [priorityPositions]="priorityPositions"
  [(overlayOrigin)]="openedBy"
  [panelClass]="overlayPanelClass"
  [backdropClass]="'q-legacy-menu-backdrop'">
  <div
    class="q-legacy-menu-container"
    tabindex="-1"
    role="menu"
    [attr.data-qt]="dataQt"
    (keydown)="_handleKeydown($event)">
    <div class="q-legacy-menu-content">
      <ng-content />
    </div>
  </div>
</q-overlay>
