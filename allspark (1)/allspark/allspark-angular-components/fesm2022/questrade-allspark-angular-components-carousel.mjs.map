<div class="q-carousel-container">
  <ul class="q-carousel-list">
    <li
      *ngFor="let item of _numSequence(_indicatorsCount); let i = index"
      class="q-carousel-item"
      role="listitem"
      [attr.aria-selected]="i === _activeItem"
      (click)="_onClick(i + 1)"
      (keyup.enter)="_onClick(i + 1)"
      (keyup.space)="_onClick(i + 1)">
      <div class="q-carousel-indicator"></div>
    </li>
  </ul>
  <div
    *ngIf="_indicatorsCount"
    #activeItem
    class="q-carousel-active-item"
    [@animateRight]="{
      value: _animateRight,
      params: { itemSize, growSize, xValue: _activeItemIndicatorXPosition },
    }"
    [@animateLeft]="{
      value: _animateLeft,
      params: { itemSize, growSize, xValue: _activeItemIndicatorXPosition },
    }"
    (@animateRight.done)="_animateRight = false"
    (@animateLeft.done)="_animateLeft = false">
    <div class="q-carousel-indicator"></div>
  </div>
</div>
