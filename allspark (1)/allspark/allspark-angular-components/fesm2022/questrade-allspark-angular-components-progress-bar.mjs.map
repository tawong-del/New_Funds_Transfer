<ng-container [ngSwitch]="variant">
  <!-- standard -->
  <ng-container *ngSwitchCase="'standard'">
    <div class="q-progress-bar-standard">
      <div class="q-progress-bar-background">
        <div class="q-progress-bar-background-filler" [style.width.%]="progress"></div>
      </div>
    </div>
  </ng-container>

  <!-- steps -->
  <ng-container *ngSwitchCase="'steps'">
    <div class="q-progress-bar-steps">
      <div
        *ngFor="let percent of _segmentPercents; let i = index"
        class="q-progress-bar-background q-progress-bar-segment-radius">
        <div
          class="q-progress-bar-background-filler"
          [style.width.%]="percent"
          [class.in-review-state]="_isSegmentInReview(i)"></div>
      </div>
    </div>
  </ng-container>

  <!-- circular -->
  <ng-container *ngSwitchCase="'circular'">
    <div
      class="q-progress-bar-circular"
      [ngClass]="{
        'q-progress-bar-not-started': progress === 0,
        'q-progress-bar-selected-state': progress === 100 && selectedState,
        'q-progress-bar-disabled-state':
          disabled && ((progress === 100 && !selectedState) || progress === 0),
        'q-progress-bar-in-progress': progress > 0 && progress < 100,
      }">
      <svg viewBox="0 0 100 100">
        <path
          class="q-progress-bar-circular-trail"
          [ngClass]="{ 'q-progress-bar-circular-trail--selected': selectedState }"
          [attr.stroke-width]="progress ? _circularStrokeWidth : 1"
          [attr.d]="_pathString"
          [attr.stroke-dasharray]="_progressTrailPath.strokeDasharray"></path>
        <path
          class="q-progress-bar-circular-path"
          [ngClass]="{
            'q-progress-bar-circular-path--success': _showSuccess,
            'q-progress-bar-circular-path--selected': selectedState,
          }"
          [attr.d]="_pathString"
          [attr.stroke-width]="progress ? _circularStrokeWidth : 0"
          [attr.stroke-dasharray]="_progressCirclePath.strokeDasharray"></path>
      </svg>

      <q-icon
        *ngIf="_showSuccess && !selectedState; else circleLabel"
        name="thickCheck"
        class="q-progress-bar-circular-icon-success" />
      <ng-template #circleLabel>
        <span class="q-progress-bar-circular-label q-display-xs">{{ circularProgressLabel }}</span>
      </ng-template>
    </div>
  </ng-container>

  <!-- loading -->
  <ng-container *ngSwitchCase="'loading'">
    <div class="q-pbl">
      <div class="q-pbl-background">
        <div class="q-pbl-background-filler" [style.width.%]="progress"></div>
      </div>
    </div>
  </ng-container>
</ng-container>
