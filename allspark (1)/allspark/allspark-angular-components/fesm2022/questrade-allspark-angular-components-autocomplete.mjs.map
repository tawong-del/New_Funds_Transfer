<q-input-group
  [prefix]="prefixIcon"
  [suffix]="suffixIcon"
  qDropmenuOrigin
  #menuTrigger="qDropmenuOrigin"
  (click)="_preventDropmenuClose($event)">
  <ng-content select="input[qInput]" />
</q-input-group>

<ng-template #prefixIcon>
  <q-icon [name]="variant === 'search' ? 'search' : 'locationOutline'" size="24" />
</ng-template>

<ng-template #suffixIcon>
  <q-icon
    #clearIconRef
    class="q-autocomplete-clear-icon q-focus-indicator"
    [class.q-autocomplete-clear-icon-hidden]="!_showClearIcon"
    name="cancelOutline"
    size="24"
    tabindex="0"
    (click)="_clear()"
    (mouseover)="_clearIconCanHaveFocus = true"
    (mouseout)="_clearIconCanHaveFocus = false"
    (keydown)="_onClearIconKeydown($event)" />
</ng-template>

<q-dropmenu
  #dropmenu
  [options]="options"
  [value]="_value"
  [loading]="loading"
  [density]="dropmenuDensity"
  [minWidth]="dropmenuMinWidth"
  [minHeight]="dropmenuMinHeight"
  [offsetY]="dropmenuOffsetY"
  [offset]="dropmenuOffset"
  [fitOverlayWidth]="dropmenuWidth === 'full'"
  [footerMessage]="footerMessage"
  [dropmenuTrigger]="menuTrigger"
  [textToHighlight]="(_searchStringObservable | async) || ''"
  [highlightCaseSensitive]="searchCaseSensitive"
  [footerTemplate]="footerTemplate"
  [optionTemplate]="optionTemplate"
  [emptyStateTemplate]="emptyStateTemplate"
  [loadingVariant]="loadingVariant"
  [loadingSkeletonTemplate]="loadingSkeletonTemplate"
  [overlayHasBackdrop]="false"
  (opened)="_onDropmenuOpened()"
  (closed)="_onDropmenuClosed()"
  (valueChange)="_onValueChange($event)" />
