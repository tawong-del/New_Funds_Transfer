<div
  class="q-tooltip-container"
  [class.q-tooltip-top]="position === 'top'"
  [class.q-tooltip-bottom]="position === 'bottom'"
  [class.q-tooltip-right]="position === 'right'"
  [class.q-tooltip-left]="position === 'left'"
  [@openClose]="{
    value: isOpen ? 'open' : 'closed',
    params: {
      translationX: translationValues.x,
      translationY: translationValues.y,
    },
  }"
  (@openClose.done)="_onAnimationDone($event)">
  {{ value }}
</div>
