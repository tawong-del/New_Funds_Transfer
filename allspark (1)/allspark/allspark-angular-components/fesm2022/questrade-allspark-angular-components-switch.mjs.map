<input
  #inputRef
  role="switch"
  class="q-switch-input"
  type="checkbox"
  [checked]="checked"
  [disabled]="disabled"
  (blur)="onInputBlur()" />

<div class="q-switch-highlight"></div>

<div class="q-switch-handle">
  <q-switch-icon [checked]="checked" [disabled]="disabled" />
</div>

<div class="q-switch-track"></div>

<ng-content />
